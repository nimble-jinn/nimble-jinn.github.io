<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="NimbleJinn">
  <defs>
    <linearGradient id="njGrad" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0EA5C4"/>
      <stop offset="0.45" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#7C6CFF"/>
    </linearGradient>
  </defs>

  <!-- Vessel -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="url(#njGrad)"/>

  <!-- The ascending stroke: an N whose tail lifts away as a spark. -->
  <path d="M19 47 V21 L41 43 V27"
        fill="none" stroke="#0B0E17" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="41" y="12" width="9" height="9" rx="2" fill="#0B0E17" transform="rotate(45 45.5 16.5)"/>
</svg>
